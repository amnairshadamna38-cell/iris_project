<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Species Predictor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #161b22; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); width: 100%; max-width: 550px; border: 1px solid #30363d; }
        h2 { text-align: center; margin-bottom: 8px; color: #2ea043; font-size: 26px; }
        p.subtitle { text-align: center; color: #8b949e; margin-bottom: 25px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 12px; margin-bottom: 5px; color: #8b949e; font-weight: 600; }
        input { padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; outline: none; }
        input:focus { border-color: #2ea043; }
        button { grid-column: span 2; margin-top: 15px; padding: 12px; border: none; border-radius: 6px; background: #238636; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2ea043; }
        #result { margin-top: 20px; text-align: center; font-size: 20px; font-weight: bold; min-height: 35px; padding: 10px; border-radius: 6px; background: #21262d; border: 1px solid #30363d; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌸 Iris Species Predictor</h2>
    <p class="subtitle">Enter flower measurements in cm</p>
    <form id="irisForm">
        <div class="grid">
            <div class="input-group"><label>Sepal Length (cm)</label><input type="number" step="any" id="sepal_length" value="5.1" required></div>
            <div class="input-group"><label>Sepal Width (cm)</label><input type="number" step="any" id="sepal_width" value="3.5" required></div>
            <div class="input-group"><label>Petal Length (cm)</label><input type="number" step="any" id="petal_length" value="1.4" required></div>
            <div class="input-group"><label>Petal Width (cm)</label><input type="number" step="any" id="petal_width" value="0.2" required></div>
        </div>
        <button type="submit">Predict Species</button>
    </form>
    <div id="result">Predicted Species Will Appear Here</div>
</div>

<script>
    document.getElementById('irisForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const data = {
            sepal_length: document.getElementById('sepal_length').value,
            sepal_width: document.getElementById('sepal_width').value,
            petal_length: document.getElementById('petal_length').value,
            petal_width: document.getElementById('petal_width').value
        };

        const resultDiv = document.getElementById('result');
        resultDiv.innerText = "Analyzing...";

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const res = await response.json();
            if (res.status === 'success') {
                resultDiv.innerText = "Predicted Species: " + res.prediction;
            } else {
                resultDiv.innerText = "Error in prediction!";
            }
        } catch (error) {
            resultDiv.innerText = "Server Connection Error!";
        }
    });
</script>

</body>
</html>
